<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>春天</title>
<!-- hint：This is what you are familiar with，4 -->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:#0d1015;
    color:#e8eef6;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  #bg{
    position:fixed;inset:0;width:100%;height:100%;
    display:block;z-index:0;pointer-events:none;
  }
  .stage{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    max-width:100%;
  }
  .code{
    font-size:clamp(14px,4.2vw,22px);
    line-height:1.5;
    letter-spacing:.06em;
    word-break:break-all;
    text-align:center;
    cursor:pointer;
    user-select:none;
    padding:8px 10px;
    border-radius:10px;
    transition:transform .12s ease,opacity .2s ease;
    text-shadow:0 2px 16px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.7);
  }
  .code:active{transform:scale(.985);}
  .tip{
    height:20px;
    font-size:14px;
    letter-spacing:.04em;
    color:#3fb950;
    opacity:0;
    transform:translateY(-4px);
    transition:opacity .25s ease,transform .25s ease;
    pointer-events:none;
    text-shadow:0 1px 10px rgba(0,0,0,.8);
  }
  .tip.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="stage">
  <div class="code" id="c" role="button" tabindex="0" aria-label="copy"></div>
  <div class="tip" id="t">Copied!</div>
</div>

<script>
(function () {

  /* ---------- shape field ---------- */

  var cv  = document.getElementById('bg');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var shapes = [];
  var KINDS = ['circle', 'square', 'triangle', 'hex', 'diamond'];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function spawn(initial) {
    var z = Math.random();                       // 0 = far, 1 = near
    var size = 12 + Math.random() * 44;
    var scale = 0.25 + z * 1.25;
    var margin = size * scale * 2 + 60;

    return {
      z: z,
      kind: KINDS[(Math.random() * KINDS.length) | 0],
      x: initial ? Math.random() * (W + margin * 2) - margin
                 : W + margin + Math.random() * 220,
      y: Math.random() * H,
      size: size,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.55 * (0.35 + z),
      speed: (18 + Math.random() * 62) * (0.25 + z * 1.5)
    };
  }

  function build() {
    var count = Math.round(Math.min(64, Math.max(16, (W * H) / 36000)));
    shapes = [];
    for (var i = 0; i < count; i++) shapes.push(spawn(true));
  }

  function path(s, r) {
    ctx.beginPath();
    switch (s.kind) {
      case 'circle':
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        break;
      case 'square':
        ctx.rect(-r, -r, r * 2, r * 2);
        break;
      case 'triangle':
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.866, r * 0.5);
        ctx.lineTo(-r * 0.866, r * 0.5);
        ctx.closePath();
        break;
      case 'hex':
        for (var i = 0; i < 6; i++) {
          var a = (Math.PI / 3) * i - Math.PI / 6;
          var px = Math.cos(a) * r, py = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        break;
      case 'diamond':
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.66, 0);
        ctx.lineTo(0, r);
        ctx.lineTo(-r * 0.66, 0);
        ctx.closePath();
        break;
    }
  }

  function paint(s) {
    var scale = 0.25 + s.z * 1.25;
    var r = s.size * scale;

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);

    ctx.globalAlpha = 0.05 + s.z * 0.22;
    ctx.strokeStyle = '#9dc0ff';
    ctx.lineWidth = Math.max(0.6, 0.5 + s.z * 1.7);
    ctx.lineJoin = 'round';

    path(s, r);
    ctx.stroke();

    ctx.restore();
  }

  var last = performance.now();

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    ctx.clearRect(0, 0, W, H);
    shapes.sort(function (a, b) { return a.z - b.z; });

    for (var i = 0; i < shapes.length; i++) {
      var s = shapes[i];
      s.x -= s.speed * dt;
      s.rot += s.spin * dt;

      var scale = 0.25 + s.z * 1.25;
      var edge = s.size * scale * 2 + 80;

      if (s.x < -edge) {
        var n = spawn(false);
        s.x = n.x; s.y = n.y; s.z = n.z;
        s.kind = n.kind; s.size = n.size;
        s.rot = n.rot; s.spin = n.spin; s.speed = n.speed;
      }

      paint(s);
    }

    requestAnimationFrame(frame);
  }

  resize();
  build();
  requestAnimationFrame(frame);

  var rt = null;
  window.addEventListener('resize', function () {
    if (rt) clearTimeout(rt);
    rt = setTimeout(function () {
      resize();
      build();
    }, 180);
  });

  /* ---------- payload ---------- */

  var P = [
    "5a23252b3f217e5e262d3a2f5a3d7b7d5b5d28293c3e4024",
    "402924255e262328292b21763f517e273a3b2f3d2d2b3f43",
    "31322e33343536373839463061626d63646566676869556a",
    "2140234a24255e26235228292b2d3d4c5b5d7b7d3a2e3b3f",
    "3f2f3a3b597e27213b402324255e26235028292b242d3d21",
    "31323334353c364037383930616263646561666768696a6b",
    "7e21402324255d5e262328292b2d3d5b5d7b7a7d2f3a3b3f"
  ];

  function decode(hex) {
    var out = '', i = 0;
    for (; i < hex.length; i += 2) {
      out += String.fromCharCode(parseInt(hex.slice(i, i + 2), 16));
    }
    return out;
  }

  var fingerprint = [
    navigator.userAgent,
    navigator.language,
    navigator.platform || "",
    screen.width,
    screen.height,
    screen.colorDepth,
    window.devicePixelRatio || 1,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency || 0,
    navigator.maxTouchPoints || 0
  ].join("|");

  var h = 2166136261;
  for (var k = 0; k < fingerprint.length; k++) {
    h ^= fingerprint.charCodeAt(k);
    h = Math.imul(h, 16777619) >>> 0;
  }

  var text = decode(P[h % P.length]);

  var codeEl = document.getElementById('c');
  var tipEl  = document.getElementById('t');
  codeEl.textContent = text;

  var timer = null;

  function flash() {
    tipEl.classList.add('show');
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      tipEl.classList.remove('show');
    }, 3000);
  }

  function fallback(t) {
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, t.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (ok) flash();
  }

  function copy() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash, function () { fallback(text); });
    } else {
      fallback(text);
    }
  }

  codeEl.addEventListener('click', copy);
  codeEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      copy();
    }
  });

})();
</script>
</body>
</html>
